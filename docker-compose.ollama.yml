# Opt-in overlay: run Ollama as a Docker container.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.ollama.yml up -d
#
# Pair with docker-compose.gpu.yml on NVIDIA Linux hosts for GPU acceleration.
# Not recommended on Mac — Docker on Mac cannot access Metal; run Ollama on the
# host instead and keep the default compose file.

services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:11434/api/tags || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  backend:
    environment:
      # Point backend at the in-compose Ollama instead of the host.
      - LLM_API_BASE=http://ollama:11434/v1
    depends_on:
      ollama:
        condition: service_healthy

volumes:
  ollama_models:
