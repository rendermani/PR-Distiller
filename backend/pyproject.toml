[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "agile-rule-extractor-backend"
version = "0.1.0"
description = "Backend for PR-Distiller AGILE-RULE-EXTRACTOR"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "pydantic>=2.0.0",
    "requests",
    "presidio-analyzer",
    "presidio-anonymizer",
    "chromadb",
    "litellm",
    "cryptography",
    "tree-sitter>=0.22",
    "tree-sitter-javascript",
    "tree-sitter-typescript",
    "tree-sitter-go",
    "tree-sitter-rust"
]

[tool.pytest.ini_options]
testpaths = ["tests", "scripts"]

[tool.coverage.run]
source = [".", "db", "llm", "pipeline"]
