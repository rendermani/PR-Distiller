[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pr-distiller-backend"
version = "0.1.0"
description = "Backend for PR-Distiller"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "pydantic>=2.0.0",
    "requests",
    "presidio-analyzer",
    "presidio-anonymizer",
    "chromadb",
    "sentence-transformers",
    "litellm",
    "cryptography",
    "tree-sitter>=0.22",
    "tree-sitter-javascript",
    "tree-sitter-typescript",
    "tree-sitter-go",
    "tree-sitter-rust"
]

[tool.setuptools]
py-modules = ["api", "settings"]
packages = ["db", "llm", "pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests", "scripts"]

[tool.coverage.run]
source = [".", "db", "llm", "pipeline"]
