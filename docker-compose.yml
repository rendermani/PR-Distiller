services:
  # ---------------------------------------------------------------------------
  # Backend — FastAPI + ChromaDB + LLM extraction pipeline
  #
  # The LLM itself is NOT in this file. Choose one:
  #   - Host Ollama (Mac/Windows/Linux):  default LLM_API_BASE points to host
  #   - Host MLX (Apple Silicon):         set LLM_API_BASE to host MLX server
  #   - Containerized Ollama (Linux):     add -f docker-compose.ollama.yml
  #   - NVIDIA GPU for container Ollama:  also add -f docker-compose.gpu.yml
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "${API_PORT:-8923}:8923"
    volumes:
      - backend_data:/app/data
    env_file:
      - path: .env
        required: false
    environment:
      - LLM_API_BASE=${LLM_API_BASE:-http://host.docker.internal:11434/v1}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-ollama/qwen3:8b}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-BAAI/bge-base-en-v1.5}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - GITHUB_WEBHOOK_SECRET=${GITHUB_WEBHOOK_SECRET:-}
      - FERNET_KEY=${FERNET_KEY:-}
      - API_AUTH_TOKEN=${API_AUTH_TOKEN:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:4096,http://localhost:3000}
      - DATA_DIR=/app/data
    extra_hosts:
      # Makes host.docker.internal resolve on Linux (no-op on Mac/Windows).
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8923/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ---------------------------------------------------------------------------
  # Web UI — Next.js dashboard
  # ---------------------------------------------------------------------------
  web-ui:
    build:
      context: ./web-ui
      dockerfile: Dockerfile
    ports:
      - "${WEB_PORT:-4096}:3000"
    environment:
      # In-network target for the same-origin /api/proxy/* route handler.
      # The browser never sees this URL — it only hits the Next.js server.
      - BACKEND_INTERNAL_URL=http://backend:8923
      # Where to read the auto-generated bearer token (mounted from backend volume).
      - API_AUTH_TOKEN_FILE=/backend-data/.api_token
      # Operator override; takes precedence over the file.
      - API_AUTH_TOKEN=${API_AUTH_TOKEN:-}
    volumes:
      # Read-only — only the backend writes the token; the proxy reads it.
      - backend_data:/backend-data:ro
    depends_on:
      backend:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # MCP Server — TypeScript bridge for Cursor / Claude Code
  # MCP uses stdio — run via: docker compose run --rm mcp-server
  # ---------------------------------------------------------------------------
  mcp-server:
    build:
      context: ./mcp-server
      dockerfile: Dockerfile
    environment:
      - PR_DISTILLER_API_URL=http://backend:8923
    depends_on:
      - backend
    stdin_open: true
    profiles:
      - mcp

volumes:
  backend_data:
